info:
  name: Update supplier
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/suppliers/{{supplierId}}"
  body:
    type: json
    data: |2-
        {
          "companyName": "Ibérica Componentes, Lda",
          "email": "encomendas@ibericacomponentes.pt",
          "taxId": "501234567",
          "phone": "+351 210 000 000",
          "address": "Avenida da Liberdade 50",
          "city": "Lisboa",
          "postalCode": "1250-096",
          "country": "PT",
          "active": true
        }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.version
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
