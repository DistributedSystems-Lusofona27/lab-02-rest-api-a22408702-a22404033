info:
  name: List suppliers
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/suppliers"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
