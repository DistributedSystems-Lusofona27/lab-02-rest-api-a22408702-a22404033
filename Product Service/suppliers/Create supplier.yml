info:
  name: Create supplier
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/suppliers"
  body:
    type: json
    data: |2-
        {
          "companyName": "Ibérica Componentes, Lda",
          "email": "encomendas@ibericacomponentes.pt",
          "taxId": "501234567",
          "phone": "+351 210 000 000",
          "address": "Rua da Prata 120, 2.º Esq.",
          "city": "Lisboa",
          "postalCode": "1100-052",
          "country": "PT",
          "active": true
        }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: supplierId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
