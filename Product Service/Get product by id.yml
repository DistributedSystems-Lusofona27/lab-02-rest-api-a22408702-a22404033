info:
  name: Get product by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.sku
      operator: eq
      value: KB-87-BRN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
