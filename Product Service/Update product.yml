info:
  name: Update product
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: '{"name":"Mechanical Keyboard","description":"87-key tenkeyless, brown switches, PBT keycaps","sku":"KB-87-BRN","price":79.90,"currency":"EUR","stock":30}'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.version
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
