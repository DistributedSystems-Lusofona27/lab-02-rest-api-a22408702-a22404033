info:
  name: Create SKU duplicado
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/products"
  body:
    type: json
    data: '{"name":"Mechanical Keyboard","description":"87-key tenkeyless, brown switches, PBT keycaps","sku":"KB-87-BRN","price":89.90,"currency":"EUR","stock":25}'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
