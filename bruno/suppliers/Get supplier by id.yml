info:
  name: Get supplier by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/suppliers/{{supplierId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.taxId
      operator: eq
      value: '"501234567"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
