info:
  name: Delete supplier
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/suppliers/{{supplierId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
